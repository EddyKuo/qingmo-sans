<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  晴墨黑體 Qingmo Sans TC 的 fontconfig 設定（Linux 桌面）。

  安裝（單一使用者）：
    mkdir -p ~/.local/share/fonts ~/.config/fontconfig/conf.d
    cp static/*.ttf ~/.local/share/fonts/      # 或 variable/QingmoSansTC[wght].ttf
    cp 60-qingmo-sans-tc.conf ~/.config/fontconfig/conf.d/
    fc-cache -f
  驗證：
    fc-match 'sans\-serif:lang=zh-tw'   應顯示 Qingmo Sans TC（pattern 語法中 "-" 要跳脫）
  GNOME 等桌面的介面字型另有設定，例如：
    gsettings set org.gnome.desktop.interface font-name 'Qingmo Sans TC 11'
  系統層級改放 /usr/share/fonts/ 與 /etc/fonts/conf.d/。
-->
<fontconfig>
  <description>Prefer Qingmo Sans TC for Traditional Chinese sans-serif and system-ui</description>

  <!-- zh-TW / zh-HK / zh-MO 的 sans-serif、system-ui 優先使用晴墨 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Qingmo Sans TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Qingmo Sans TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test qual="any" name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Qingmo Sans TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test qual="any" name="family" compare="eq"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Qingmo Sans TC</string></edit>
  </match>

  <!-- 晴墨沒有 hinting：用 FreeType 的輕量自動 hinting，小字較銳利 -->
  <match target="font">
    <test name="family" compare="eq"><string>Qingmo Sans TC</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
