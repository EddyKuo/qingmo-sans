# 晴墨黑體 — 機器可讀的 Design Spec（與 Design Spec v0 文件同步）
# 任何參數變更都要同時更新 FONTLOG.txt。

family:
  zh: 晴墨黑體
  en: Qingmo Sans TC
  ps_prefix: QingmoSansTC
  version: "0.102"
  vendor: QMSP            # TODO: 4 字元 vendor ID，發布前向 Microsoft 註冊
  repo: https://github.com/EddyKuo/qingmo-sans

base:
  name: Source Han Sans TC (Variable, TrueType; Region-specific Subset TW, release 2.005)
  # 釘在 release 分支的 commit，避免 URL 內容變動
  url: https://raw.githubusercontent.com/adobe-fonts/source-han-sans/a4f7cf94edfb9d7ffbdfc4841de276358bd7e0f2/Variable/TTF/Subset/SourceHanSansTW-VF.ttf
  filename: SourceHanSansTC-VF.ttf
  sha256: cf6889f4c0f1adeaf814ca3e98cc692d9e2d706501cf7545b9b58f6e3966b6ac
  reserved_font_name: Source

axis:
  tag: wght
  name: Weight
  default: 400

# 從母體 VF 抽出的 master 位置；母體 wght 範圍 250..900（Phase 1 確認）
masters: [250, 400, 900]

instances:
  - {name: ExtraLight, zh: 極細, wght: 250}
  - {name: Light,      zh: 細,   wght: 300}
  - {name: Regular,    zh: 標準, wght: 400}
  - {name: Medium,     zh: 中,   wght: 500}
  - {name: Bold,       zh: 粗,   wght: 700}
  - {name: Heavy,      zh: 特粗, wght: 900}

charsets:
  phase1: config/charsets/phase1.txt
  highfreq500: config/charsets/highfreq500.txt   # 抽檢範圍；由 scripts/charsets/highfreq.py 產生，已併入 phase1
  big5: config/charsets/big5.txt                 # PRD v1.0：Big5 全部漢字 13,064 字
  full: config/charsets/full.txt                 # 母體全部漢字 17,760 字（建置預設）
  strokes: config/charsets/strokes-sample.txt    # 筆畫模板取樣（提、長點與不應改變的對照字）

# 風格參數：Regular (wght 400) 的 v0 初值，見 Spec「風格參數」
style:
  aspect_ratio: 1.00            # 字身方正
  counter_open_pct: -25.0       # 中宮：正值放鬆、負值收緊；最大位移 = 125 × k / 100 units（-25 ≈ 31 units，約字身 3%）。0.101 起收緊（維護者核可）
  center_shift_up_pct: 2.0      # 重心：字身中段上移 2%（20 units），框頂框底不動。0.101 起
  contrast_h_over_v: 0.82       # 橫 / 豎 粗細比
  entry_cut_deg: 12             # 起筆斜切角
  exit_taper_pct: 8             # 收筆微收
  corner_radius_units: 6        # 折角軟化半徑（UPM 1000），隨字重縮放
  # 筆畫模板（strokes.py）
  pie_tip_pct: 55               # 撇：出鋒端寬度縮為原本的 55%
  pie_min_width: 22             # 撇：出鋒端最小寬度（UPM 1000），末端不留尖刺
  na_tip_out_pct: 35            # 捺：尖端外移（× 端寬）
  na_tip_rise_pct: 15           # 捺：尖端高於平台（× 端寬）
  dot_tip_pct: 25               # 點：上端收尖，寬度縮為 25%
  dot_round_pct: 60             # 點：下端圓頭凸出（× 端寬）
  # 楷書筆意（0.102，含蓄）：提（策）、長點（側）
  ti_head_pct: 115              # 提：起筆（左下）端寬放大為 115%（頓按）
  ti_round_pct: 35              # 提：起筆圓頭凸出（× 端寬）
  ti_tip_pct: 22                # 提：尖端（右上）寬度縮為 22%（出鋒）
  changdian_tip_pct: 35         # 長點：頂端寬度縮為 35%（起筆輕）
  changdian_press_pct: 115      # 長點：尾端寬度放大為 115%（漸按）
  changdian_round_pct: 45       # 長點：尾端圓頭凸出（× 端寬；尾端原本是曲線時不再插點）
  # 楷書筆意（0.102，含蓄）：鉤（趯）—— 豎鉤、彎鉤、橫折鉤、臥鉤、斜鉤、豎彎鉤、豎提
  hook_tip_pct: 35              # 鉤：鉤尖往內側收，寬度縮為 35%（出鋒）
  hook_sweep_pct: 50            # 鉤：外側邊最後一個控制點跟著鉤尖移動 50%（往上挑）
  hook_press_pct: 12            # 鉤：鉤前轉彎的外緣往外鼓（× 鉤尖寬，頓筆）

# 依序套用的幾何改造（只作用於 CJK 統一漢字）。point transform 不得改變點數；
# structural transform（strokes、corners）在所有 master 做相同的結構變更，且必須排在所有 point transform 之後
transforms: [proportion, contrast, terminals, strokes, corners]

qa:
  forbidden_name_terms: [Source]
  gray_std_ratio_max: 1.05     # 灰度：漢字覆蓋率標準差 / 母體同字重標準差 的上限（Phase 1 定案）
