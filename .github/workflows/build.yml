name: build

on:
  push:
    branches: ["**"]   # 推 tag 不觸發；tag 由 release.yml 建置並發佈
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make test
      - run: make smoke

  build:
    # config/spec.yaml 的 base.url / base.sha256 已於 Phase 1 鎖定
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make all
      - uses: actions/upload-artifact@v6
        with:
          name: qingmo-sans-fonts
          path: fonts/
