name: build

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make smoke

  build:
    # 啟用條件：config/spec.yaml 的 base.url 與 base.sha256 已在 Phase 1 鎖定
    if: ${{ vars.BASE_PINNED == 'true' }}
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: qingmo-sans-fonts
          path: fonts/
